pre-commit:
  parallel: true
  commands:
    lint:
      run: npx eslint --max-warnings 0 {staged_files}
      glob: "*.{ts,tsx,mjs}"

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: npx tsc --noEmit
    build:
      run: npm run build
